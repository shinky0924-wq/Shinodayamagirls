<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E85B91"/>
      <stop offset="55%" stop-color="#B84B76"/>
      <stop offset="100%" stop-color="#873355"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
  </defs>

  <!-- Crisp High-Contrast Emblem Base -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="54.5" fill="none" stroke="url(#goldRim)" stroke-width="3"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-opacity="0.45"/>

  <!-- Bold White Sakura Blossom (5 distinct notched petals for crystal-clear readability at 36-44px) -->
  <g transform="translate(60, 61)">
    <path d="M 0 -9 C -14 -20, -19 -39, -7 -45 L 0 -38 L 7 -45 C 19 -39, 14 -20, 0 -9 Z" fill="#FFFFFF"/>
    <g transform="rotate(72)">
      <path d="M 0 -9 C -14 -20, -19 -39, -7 -45 L 0 -38 L 7 -45 C 19 -39, 14 -20, 0 -9 Z" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(144)">
      <path d="M 0 -9 C -14 -20, -19 -39, -7 -45 L 0 -38 L 7 -45 C 19 -39, 14 -20, 0 -9 Z" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(216)">
      <path d="M 0 -9 C -14 -20, -19 -39, -7 -45 L 0 -38 L 7 -45 C 19 -39, 14 -20, 0 -9 Z" fill="#FFFFFF"/>
    </g>
    <g transform="rotate(288)">
      <path d="M 0 -9 C -14 -20, -19 -39, -7 -45 L 0 -38 L 7 -45 C 19 -39, 14 -20, 0 -9 Z" fill="#FFFFFF"/>
    </g>

    <!-- Blossom Center -->
    <circle cx="0" cy="0" r="10.5" fill="#873355"/>
    <circle cx="0" cy="0" r="7" fill="#FBBF24"/>
    <circle cx="0" cy="0" r="3" fill="#FFFBEB"/>
  </g>
</svg>
