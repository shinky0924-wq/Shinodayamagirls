<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#fff1f2"/>
      <stop offset="60%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </radialGradient>
    <linearGradient id="petalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffe4e6"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#be123c" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Outer Ring -->
  <circle cx="60" cy="60" r="56" fill="url(#bgGrad)"/>
  <circle cx="60" cy="60" r="54" fill="none" stroke="url(#goldRim)" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="50" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Sakura Petals Group (5-fold symmetry) -->
  <g transform="translate(60, 60)" filter="url(#softGlow)">
    <!-- Petal 1 -->
    <path d="M 0 -7 C -14 -20, -18 -42, 0 -48 C 18 -42, 14 -20, 0 -7 Z" fill="url(#petalGrad)"/>
    <!-- Petal 2 -->
    <g transform="rotate(72)">
      <path d="M 0 -7 C -14 -20, -18 -42, 0 -48 C 18 -42, 14 -20, 0 -7 Z" fill="url(#petalGrad)"/>
    </g>
    <!-- Petal 3 -->
    <g transform="rotate(144)">
      <path d="M 0 -7 C -14 -20, -18 -42, 0 -48 C 18 -42, 14 -20, 0 -7 Z" fill="url(#petalGrad)"/>
    </g>
    <!-- Petal 4 -->
    <g transform="rotate(216)">
      <path d="M 0 -7 C -14 -20, -18 -42, 0 -48 C 18 -42, 14 -20, 0 -7 Z" fill="url(#petalGrad)"/>
    </g>
    <!-- Petal 5 -->
    <g transform="rotate(288)">
      <path d="M 0 -7 C -14 -20, -18 -42, 0 -48 C 18 -42, 14 -20, 0 -7 Z" fill="url(#petalGrad)"/>
    </g>

    <!-- Center Blossom Core -->
    <circle cx="0" cy="0" r="9" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="6" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="2.5" fill="#e11d48"/>
  </g>

  <!-- Sparkle Accent -->
  <g transform="translate(92, 28)">
    <path d="M 0 -6 L 1.8 -1.8 L 6 0 L 1.8 1.8 L 0 6 L -1.8 1.8 L -6 0 L -1.8 -1.8 Z" fill="#fbbf24"/>
  </g>
</svg>
